[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "landscope"
version = "0.1.0"
description = "Lokalna analiza rzeczywistych transakcji gruntowych"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "shapely>=2.0,<3", "pyproj>=3.7,<4", "defusedxml>=0.7,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.59,<2"]
[project.scripts]
landscope = "landscope.cli:main"
[tool.setuptools.packages.find]
include = ["landscope*"]
[tool.setuptools.package-data]
landscope = ["static/*", "static/vendor/*", "sql/*.sql", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
 "unit: obliczenia", "contract: kontrakty odpowiedzi i schematów",
 "quality: jakość danych", "regression: utrwalone przypadki błędów",
 "integration: rzeczywista baza PostGIS", "online: jawne połączenia do źródeł",
 "e2e: przeglądarka Playwright", "real_data: zaimportowane rzeczywiste dane"]
