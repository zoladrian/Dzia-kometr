name: LandScope tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      online:
        description: Uruchom rzeczywiste źródła (awarie powodują błąd)
        type: boolean
        default: false
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: landscope
          POSTGRES_USER: landscope
          POSTGRES_PASSWORD: landscope_local
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U landscope -d landscope"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install '.[test]'
      - run: python -m pytest --integration --junitxml=reports/backend.xml
        env:
          DATABASE_URL: postgresql://landscope:landscope_local@127.0.0.1:55432/landscope
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.online }}
        run: python -m landscope diagnose
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.online }}
        run: python -m pytest tests/test_online.py --online --junitxml=reports/online.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
